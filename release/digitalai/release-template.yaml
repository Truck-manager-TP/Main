# =============================================================================
# Digital.ai Release template - orchestrates the end-to-end promotion of the
# TP-Truck Fleet platform from DEV -> UAT -> PROD. Import via:
#   xl apply -f release-template.yaml
# This template is the single "conductor": it calls Maven, SonarQube, Docker,
# JMeter, Terraform, ServiceNow and Argo in sequence with the right gates.
# =============================================================================
apiVersion: xl-release/v1
kind: Templates
spec:
  - name: TP-Truck - Release to Production
    type: xlrelease.Release
    scriptUsername: tptruck-svc
    variables:
      - type: xlrelease.StringVariable
        key: version
        value: "1.0.0"
      - type: xlrelease.StringVariable
        key: imageTag
        value: "tptruck/truck-fleet:1.0.0"
    phases:

      # ---------------- BUILD & QUALITY -----------------------------------
      - name: Build & Quality
        type: xlrelease.Phase
        tasks:
          - name: Maven build & unit tests
            type: xlrelease.CustomScriptTask
            script: "mvn -B clean verify"
          - name: SonarQube analysis + Quality Gate
            type: sonar.QualityGate      # BLOCKS the release if the gate fails
            projectKey: tptruck-fleet
            failOnQualityGateError: true
          - name: Build & push Docker image
            type: xlrelease.CustomScriptTask
            script: "docker build -t ${imageTag} ./app && docker push ${imageTag}"

      # ---------------- DEPLOY DEV ----------------------------------------
      - name: Deploy DEV
        type: xlrelease.Phase
        tasks:
          - name: Terraform apply (dev)
            type: xlrelease.CustomScriptTask
            script: "terraform -chdir=infra/terraform apply -auto-approve -var-file=environments/dev.tfvars"
          - name: Flyway migrate (dev)
            type: xlrelease.CustomScriptTask
            script: "docker run --rm tptruck/flyway:${version} migrate"
          - name: Argo sync truck-fleet-dev
            type: argocd.Sync
            application: truck-fleet-dev

      # ---------------- TEST UAT ------------------------------------------
      - name: Deploy & Test UAT
        type: xlrelease.Phase
        tasks:
          - name: Open ServiceNow Change (UAT)
            type: servicenow.CreateChangeRequest
            shortDescription: "Promote TP-Truck ${version} to UAT"
            changeType: normal
          - name: Promote image tag to UAT overlay (git commit)
            type: xlrelease.CustomScriptTask
            script: "kustomize edit set image tptruck/truck-fleet=${imageTag} && git commit -am 'promote ${version} to uat'"
          - name: Argo sync truck-fleet-uat
            type: argocd.Sync
            application: truck-fleet-uat
          - name: JMeter performance test
            type: xlrelease.CustomScriptTask
            script: "docker run --rm --network tptruck-net tptruck/jmeter:${version}"
          - name: UAT sign-off
            type: xlrelease.GateTask       # Manual acceptance gate
            description: "Business & QA acceptance for ${version}"

      # ---------------- RELEASE PROD --------------------------------------
      - name: Release PROD
        type: xlrelease.Phase
        tasks:
          - name: Open ServiceNow Change (PROD)
            type: servicenow.CreateChangeRequest
            shortDescription: "Promote TP-Truck ${version} to PRODUCTION"
            changeType: normal
            assignmentGroup: "Change Advisory Board"
          - name: CAB approval
            type: servicenow.PollChangeRequest   # Waits until CR is Approved
            desiredState: approved
          - name: Terraform apply (prod)
            type: xlrelease.CustomScriptTask
            script: "terraform -chdir=infra/terraform apply -var-file=environments/prod.tfvars"
          - name: Argo sync truck-fleet-prod
            type: argocd.Sync
            application: truck-fleet-prod
            prune: true
          - name: Post-deploy smoke test
            type: xlrelease.CustomScriptTask
            script: "curl -fsS http://truck-fleet.prod/actuator/health"
          - name: Close ServiceNow Change
            type: servicenow.UpdateChangeRequest
            state: closed
            closeCode: successful
