apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truck-fleet-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tp-truck
  source:
    repoURL: https://github.com/Truck-manager-TP/Main.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: tp-truck-prod
  syncPolicy:
    # PROD is MANUAL sync: Jenkins triggers sync only after ServiceNow CAB approval.
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
