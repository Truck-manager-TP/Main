apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: truck-fleet-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tp-truck
  source:
    repoURL: https://github.com/Truck-manager-TP/Main.git
    targetRevision: main
    path: k8s/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: tp-truck-uat
  syncPolicy:
    # UAT syncs after Jenkins promotes the image tag via Git commit to k8s/overlays/uat.
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
