# PROD override: hardened. Ports bound behind the ingress/LB only; secrets from
# the environment (injected by Terraform/Digital.ai Deploy, never committed).
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
  app:
    environment:
      APP_ENV: prod
      DB_POOL_MAX: "40"
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
      restart_policy:
        condition: any
  grafana:
    restart: always
  prometheus:
    restart: always
  # No SonarQube / JMeter in the production runtime.
  sonarqube:
    profiles: ["disabled"]
