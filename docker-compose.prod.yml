# PROD override: hardened runtime (secrets injected by Jenkins/Argo, never committed).
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
  app:
    environment:
      APP_ENV: prod
      DB_POOL_MAX: "40"
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
      restart_policy:
        condition: any
  grafana:
    restart: always
  prometheus:
    restart: always
  sonarqube:
    profiles: ["disabled"]
  sonarqube-exporter:
    profiles: ["disabled"]
