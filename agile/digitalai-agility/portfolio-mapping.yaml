# Digital.ai Agility portfolio structure - the scaled-agile view that aggregates
# the delivery-team Jira backlog into a program increment for leadership.
portfolio:
  name: TP-Truck Logistics Platform
  value_streams:
    - name: Fleet Operations
      epics: [PLAN, "BUILD:Fleet", "BUILD:Route", "BUILD:Driver"]
    - name: Growth
      epics: ["BUILD:Marketing"]
    - name: Platform & Reliability
      epics: [DEPLOY, OPERATE, TEST]
  program_increment:
    name: PI-2026.Q3
    sprints: [Sprint 1, Sprint 2, Sprint 3, Sprint 4, Sprint 5, Sprint 6]
    objectives:
      - "Ship all four business modules behind an automated DEV->UAT->PROD pipeline"
      - "Achieve <1 day lead-time for change from merge to PROD-ready"
      - "Zero manual environment configuration (100% IaC + GitOps)"
  metrics_synced_from:
    jira: [cycle_time, throughput, sprint_burndown]
    digitalai_release: [deployment_frequency, change_failure_rate, mttr]
