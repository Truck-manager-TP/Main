spring:
  application:
    name: truck-fleet
  profiles:
    active: ${APP_ENV:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/tptruck}
    username: ${DB_USER:tptruck}
    password: ${DB_PASSWORD:tptruck}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate:
      # 'none' : Flyway est maitre du schema. On desactive la validation stricte
      # d'Hibernate qui bloquait le demarrage (CHAR vs VARCHAR sur relay_point.country_code).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

# Actuator surface scraped by Prometheus and consumed by Grafana.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: truck-fleet
      env: ${APP_ENV:dev}

info:
  app:
    name: TP-Truck Fleet & Logistics
    version: "@project.version@"

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
