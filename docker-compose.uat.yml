# UAT override: production-like resource limits + observability exposed.
services:
  app:
    environment:
      APP_ENV: uat
    ports: ["8080:8080"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
  grafana:
    ports: ["3000:3000"]
  prometheus:
    ports: ["9090:9090"]
  sonarqube:
    profiles: ["disabled"]
  sonarqube-exporter:
    profiles: ["disabled"]
