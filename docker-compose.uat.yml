# UAT override: production-like, only the app + observability are exposed.
services:
  app:
    environment:
      APP_ENV: uat
    ports: ["8080:8080"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
  grafana:
    ports: ["3000:3000"]
  prometheus:
    ports: ["9090:9090"]
  # SonarQube is not part of the UAT runtime footprint.
  sonarqube:
    profiles: ["disabled"]
