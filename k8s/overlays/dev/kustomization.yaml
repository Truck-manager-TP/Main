apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tp-truck-dev
resources:
  - ../../base

images:
  - name: tptruck/truck-fleet
    newTag: 1.0.0

patches:
  - target:
      kind: Deployment
      name: truck-fleet
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: truck-fleet-config
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: dev
