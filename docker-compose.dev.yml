# DEV override: expose everything to the developer's localhost for fast feedback.
services:
  postgres:
    ports: ["5432:5432"]
  app:
    environment:
      APP_ENV: dev
    ports: ["8080:8080"]
  sonarqube:
    ports: ["9000:9000"]
  prometheus:
    ports: ["9090:9090"]
  grafana:
    ports: ["3000:3000"]
