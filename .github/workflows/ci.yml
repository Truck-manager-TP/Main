# =============================================================================
# GitHub Actions — Continuous Integration (full repository)
# Validates backend (app/), frontend (PorTransLine/), and infra configs.
# Does NOT deploy. On main success, triggers Jenkins CD pipeline.
# =============================================================================
name: CI - Build, Test & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/truck-manager-tp/truck-fleet
  JIRA_PROJECT_KEY: KAN

jobs:
  backend-build-test-scan:
    name: Backend (Spring Boot + SonarQube)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tptruck
          POSTGRES_USER: tptruck
          POSTGRES_PASSWORD: tptruck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tptruck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven build, test & coverage
        working-directory: app
        run: mvn -B clean verify

      - name: SonarQube scan + quality gate
        id: sonar
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::warning::SONAR_TOKEN or SONAR_HOST_URL not configured — skipping SonarQube scan."
            echo "Add both secrets under GitHub → Settings → Secrets and variables → Actions."
            echo "SONAR_HOST_URL must be reachable from GitHub (not http://localhost:9000)."
            exit 0
          fi
          mvn -B sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      - name: Create Jira Bug on Sonar gate failure
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::warning::Jira secrets not configured — skipping automated Bug creation."
            exit 0
          fi
          bash jenkins/scripts/create-jira-bug.sh sonarqube "${{ github.ref_name }}" "${{ github.sha }}"

  frontend-build:
    name: Frontend (PorTransLine / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PorTransLine/package-lock.json

      - name: Install dependencies
        working-directory: PorTransLine
        run: npm ci

      - name: Production build
        working-directory: PorTransLine
        run: npm run build

  infra-validate:
    name: Infra configs (Docker Compose + K8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose stacks
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.uat.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.sonar-scan.yml config -q

      - uses: imranismail/setup-kustomize@v2

      - name: Validate Kustomize overlays
        run: |
          kustomize build k8s/overlays/dev
          kustomize build k8s/overlays/uat
          kustomize build k8s/overlays/prod

  trigger-jenkins-cd:
    name: Trigger Jenkins CD
    needs: [backend-build-test-scan, frontend-build, infra-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins CD pipeline
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "::warning::Jenkins secrets not configured — skipping CD trigger."
            exit 0
          fi
          curl -fsS -X POST "${JENKINS_URL}/job/tp-truck-cd/buildWithParameters" \
            --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            --data-urlencode "GIT_SHA=${{ github.sha }}" \
            --data-urlencode "GIT_BRANCH=main" \
            --data-urlencode "IMAGE_TAG=${{ github.sha }}" \
            --data-urlencode "VERSION=1.0.0"
