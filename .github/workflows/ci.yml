# =============================================================================
# GitHub Actions — Continuous Integration (fast feedback)
# Scope: compile, unit tests, SonarQube quality gate on PRs and main.
# Does NOT deploy. On main success, triggers Jenkins CD pipeline.
# =============================================================================
name: CI - Build, Test & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/truck-manager-tp/truck-fleet
  JIRA_PROJECT_KEY: KAN

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tptruck
          POSTGRES_USER: tptruck
          POSTGRES_PASSWORD: tptruck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tptruck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven build, test & coverage
        working-directory: app
        run: mvn -B clean verify

      - name: SonarQube scan + quality gate
        id: sonar
        working-directory: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >-
          mvn -B sonar:sonar
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=true

      - name: Create Jira Bug on Sonar gate failure
        if: failure() && steps.sonar.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash jenkins/scripts/create-jira-bug.sh sonarqube "${{ github.ref_name }}" "${{ github.sha }}"

  trigger-jenkins-cd:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins CD pipeline
        run: |
          curl -fsS -X POST "${{ secrets.JENKINS_URL }}/job/tp-truck-cd/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "GIT_SHA=${{ github.sha }}" \
            --data-urlencode "GIT_BRANCH=main" \
            --data-urlencode "IMAGE_TAG=${{ github.sha }}" \
            --data-urlencode "VERSION=1.0.0"
