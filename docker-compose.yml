# =============================================================================
# TP-Truck | Standardized DevOps stack
# Allowed toolchain: Maven, Docker, SonarQube, Grafana (+ Prometheus datasource, Postgres, Redis, Flyway)
#   DEV : docker compose -f docker-compose.yml -f docker-compose.dev.yml  up -d
#   UAT : docker compose -f docker-compose.yml -f docker-compose.uat.yml  up -d
#   PROD: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# CD/deploy: Jenkins -> Argo CD (k8s/overlays/*)
# =============================================================================

name: tp-truck

networks:
  tptruck-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  grafana-data:
  prometheus-data:

services:

  postgres:
    build:
      context: ./docker/postgres
    image: tptruck/postgres:1.0.0
    environment:
      POSTGRES_DB: ${DB_NAME:-tptruck}
      POSTGRES_USER: ${DB_USER:-tptruck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tptruck}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [tptruck-net]
    restart: unless-stopped

  flyway:
    build:
      context: ./docker/flyway
    image: tptruck/flyway:1.0.0
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tptruck}
      FLYWAY_USER: ${DB_USER:-tptruck}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-tptruck}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tptruck-net]
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [tptruck-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./app
    image: tptruck/truck-fleet:${APP_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tptruck}
      DB_USER: ${DB_USER:-tptruck}
      DB_PASSWORD: ${DB_PASSWORD:-tptruck}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [tptruck-net]
    restart: unless-stopped

  sonarqube:
    build:
      context: ./docker/sonarqube
    image: tptruck/sonarqube:1.0.0
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks: [tptruck-net]
    restart: unless-stopped

  sonarqube-exporter:
    build:
      context: ./docker/sonarqube-exporter
    image: tptruck/sonarqube-exporter:1.0.0
    environment:
      SONAR_HOST: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_PROJECT_KEY: tptruck-fleet
      SCRAPE_INTERVAL_SECONDS: 60
      EXPORTER_PORT: 8190
    depends_on: [sonarqube]
    networks: [tptruck-net]
    restart: unless-stopped

  jira-bridge:
    build:
      context: ./docker/jira-bridge
    image: tptruck/jira-bridge:1.0.0
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://example.atlassian.net}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-KAN}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Bug}
      DEDUP_ENABLED: "true"
    networks: [tptruck-net]
    restart: unless-stopped

  prometheus:
    build:
      context: ./docker/prometheus
    image: tptruck/prometheus:1.0.0
    environment:
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - prometheus-data:/prometheus
    depends_on: [app, sonarqube-exporter]
    networks: [tptruck-net]
    restart: unless-stopped

  grafana:
    build:
      context: ./docker/grafana
    image: tptruck/grafana:1.0.0
    environment:
      SERVICENOW_WEBHOOK_URL: ${SERVICENOW_WEBHOOK_URL:-http://localhost/mock-servicenow}
      JIRA_BRIDGE_URL: ${JIRA_BRIDGE_URL:-http://jira-bridge:8090/webhooks/grafana}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, jira-bridge]
    networks: [tptruck-net]
    restart: unless-stopped
