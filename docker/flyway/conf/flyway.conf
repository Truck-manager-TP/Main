# Flyway configuration. Secrets/URL are injected via env at run time:
#   FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
flyway.url=${FLYWAY_URL:jdbc:postgresql://postgres:5432/tptruck}
flyway.user=${FLYWAY_USER:tptruck}
flyway.password=${FLYWAY_PASSWORD:tptruck}
flyway.locations=filesystem:/flyway/sql
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
