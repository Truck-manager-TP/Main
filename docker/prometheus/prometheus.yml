global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: tp-truck
    env: ${APP_ENV}

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'truck-fleet-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']
        labels:
          service: truck-fleet

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sonarqube'
    scrape_interval: 60s
    static_configs:
      - targets: ['sonarqube-exporter:8190']
        labels:
          service: sonarqube
          project: tptruck-fleet
